<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Doctor Medication Log - CoopVet</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/supabase.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 40px; background-color: #f0f8ff; color: #333; line-height: 1.6; }
    .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .header { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 30px; border-bottom: 3px solid #003366; padding-bottom: 20px; }
    .logo-section { display: flex; align-items: center; gap: 15px; }
    .logo-img { height: 70px; width: auto; }
    .header-title { color: #003366; margin: 0; font-size: 2rem; }
    .form-card { background: #f8fbff; padding: 20px; border-radius: 8px; border: 1px solid #b0c4de; margin-bottom: 25px; }
    h2 { color: #003366; margin-top: 0; margin-bottom: 15px; }
    .input-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
    input, select { padding: 10px; border: 1px solid #b0c4de; border-radius: 4px; flex: 1; min-width: 150px; }
    button { padding: 10px 20px; background-color: #003366; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; transition: background-color 0.2s; }
    button:hover { background-color: #00509d; }
    .status-box { border-radius: 8px; padding: 16px; margin-bottom: 20px; display: none; font-weight: 500; }
    .success { background: #e8f5e9; border: 1px solid #a5d6a7; color: #2e7d32; }
    .error { background: #ffebee; border: 1px solid #ef9a9a; color: #c62828; }
    .small { font-size: 0.85em; color: #555; margin-top: 6px; }
    .loading { text-align: center; padding: 40px; color: #666; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="logo-section">
      <img src="CoopVet.png" alt="CoopVet Logo" class="logo-img">
      <h1 class="header-title">Doctor Daily Medication Log</h1>
    </div>
  </div>

  <div id="messageBox" class="status-box"></div>

  <div class="form-card">
    <h2>Log Medication Usage</h2>
    <div class="input-row">
      <select id="doctorName">
        <option value="">Select Staff Name</option>
        <option value="Tito Estrongmane">Tito Estrongmane</option>
        <option value="Inacia Telma">Inacia Telma</option>
        <option value="Pedro Antunes">Pedro Antunes</option>
        <option value="Joyce Antunes">Joyce Antunes</option>
        <option value="Carmen do Rosario">Carmen do Rosario</option>
      </select>
      <input type="date" id="dateUsed">
    </div>
    <div class="input-row">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 5px; min-width: 200px;">
        <input type="text" id="medSearch" placeholder="Search medication..." oninput="filterMeds()">
        <select id="usedMed" style="padding: 10px; border: 1px solid #b0c4de; border-radius: 4px; width: 100%;">
          <option value="">Select Medication</option>
        </select>
      </div>
      <input type="number" step="0.01" id="usedAmount" placeholder="Amount Used" style="flex: 0.5;">
    </div>
    <button onclick="logUsage()" style="width: 100%; margin-top: 5px;">Save Daily Usage</button>
    <div id="selectedMedInfo" class="small"></div>
  </div>

  <div id="loadingScreen" class="loading">🔄 Connecting to database...</div>
</div>

<script>
const SUPABASE_URL = 'https://uoxuuthnxhuaqqplizpl.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVveHV0aG54aHVhYXFxcGxpenBsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDk2MjY0MTYsImV4cCI6MjA2NTE0MjQxNn0.YW5ZL-BRZgA2cGMzMEc5s6e3VZ9q6MLxmpuRLMN7pB8';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let stock = [];

async function init() {
  document.getElementById('loadingScreen').style.display = 'block';
  const { data } = await supabase.from('stock').select('*').order('name');
  stock = data || [];
  filterMeds();
  document.getElementById('loadingScreen').style.display = 'none';
}

function filterMeds() {
  const search = (document.getElementById('medSearch')?.value || '').toLowerCase();
  const medSelect = document.getElementById('usedMed');
  medSelect.innerHTML = '<option value="">Select Medication</option>';
  stock.filter(s => s.name.toLowerCase().includes(search)).forEach(item => {
    const opt = document.createElement('option');
    opt.value = item.name;
    opt.textContent = `${item.name} (${item.qty} ${item.unit || 'pills'} left)`;
    medSelect.appendChild(opt);
  });
}

function updateMedInfo() {
  const info = document.getElementById('selectedMedInfo');
  const med = stock.find(s => s.name === document.getElementById('usedMed').value);
  if (!med) { info.textContent = ''; return; }
  const ppb = med.packs_per_box || 1, upp = med.units_per_pack || 1;
  const boxes = (ppb * upp) ? (med.qty / (ppb * upp)).toFixed(2) : med.qty;
  info.textContent = `Available: ${med.qty} ${med.unit || 'pills'} | Boxes left: ${boxes} | Minimum required: ${med.min_boxes || 0} boxes`;
}

async function logUsage() {
  const doctorName = document.getElementById('doctorName').value.trim();
  const medName = document.getElementById('usedMed').value;
  const amount = parseFloat(document.getElementById('usedAmount').value);
  const date = document.getElementById('dateUsed').value;
  const msgBox = document.getElementById('messageBox');

  if (!doctorName || !medName || !amount || !date) {
    msgBox.className = 'status-box error'; msgBox.textContent = 'Fill all fields correctly.'; msgBox.style.display = 'block'; return;
  }

  const med = stock.find(s => s.name === medName);
  if (!med) { msgBox.className = 'status-box error'; msgBox.textContent = 'Medication not found.'; msgBox.style.display = 'block'; return; }
  if (med.qty < amount) { msgBox.className = 'status-box error'; msgBox.textContent = `Not enough stock. Current: ${med.qty} ${med.unit || 'pills'}.`; msgBox.style.display = 'block'; return; }

  const newQty = parseFloat((med.qty - amount).toFixed(2));

  const [, , { error }] = await Promise.all([
    supabase.from('stock').update({ qty: newQty }).eq('id', med.id),
    supabase.from('usage_log').insert([{ staff_name: doctorName, med: medName, amount, unit: med.unit || 'pills', date }]),
    supabase.from('stock').select('*').order('name')
  ]);

  if (error) { msgBox.className = 'status-box error'; msgBox.textContent = 'Error: ' + error.message; msgBox.style.display = 'block'; return; }

  stock = stock.map(s => s.name === medName ? { ...s, qty: newQty } : s);
  filterMeds();
  updateMedInfo();

  document.getElementById('doctorName').value = '';
  document.getElementById('usedMed').value = '';
  document.getElementById('usedAmount').value = '';
  document.getElementById('medSearch').value = '';
  document.getElementById('dateUsed').valueAsDate = new Date();

  msgBox.className = 'status-box success';
  msgBox.textContent = `${medName} logged successfully. Remaining stock: ${newQty} ${med.unit || 'pills'}.`;
  msgBox.style.display = 'block';
  setTimeout(() => { msgBox.style.display = 'none'; }, 4000);
}

document.getElementById('dateUsed').valueAsDate = new Date();
document.getElementById('usedMed').addEventListener('change', updateMedInfo);
document.getElementById('medSearch').addEventListener('input', () => { filterMeds(); updateMedInfo(); });

supabase.channel('db_changes').on('postgres_changes', { event: '*', schema: 'public', table: 'stock' }, async () => {
  const { data } = await supabase.from('stock').select('*').order('name');
  stock = data || [];
  filterMeds();
  updateMedInfo();
}).subscribe();

init();
</script>
</body>
</html>
