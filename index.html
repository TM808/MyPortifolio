<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Medical Stock Manager</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <style>
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      padding: 40px; 
      background-color: #f0f8ff; 
      color: #333; 
      line-height: 1.6;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .header-section {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
      border-bottom: 3px solid #003366;
      padding-bottom: 15px;
    }
    .logo-img {
      height: 80px;
      width: auto;
    }
    .header-text h2 {
      margin: 0;
      border-bottom: none;
      padding-bottom: 0;
    }
    h2, h3 { 
      color: #003366; 
      border-bottom: 2px solid #003366; 
      padding-bottom: 10px; 
      margin-top: 30px;
    }
    h2:first-of-type { margin-top: 0; }
    .input-row {
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    input { 
      padding: 10px; 
      border: 1px solid #b0c4de; 
      border-radius: 4px; 
      flex: 1;
      min-width: 150px;
    }
    button { 
      padding: 10px 20px; 
      background-color: #003366; 
      color: white; 
      border: none; 
      border-radius: 4px; 
      cursor: pointer; 
      font-weight: 600;
      transition: background-color 0.2s, transform 0.1s;
    }
    button:hover { 
      background-color: #00509d; 
    }
    button:active {
      transform: translateY(1px);
    }
    .export-btn {
      background-color: #2e8b57;
      margin-left: auto;
    }
    .export-btn:hover {
      background-color: #3cb371;
    }
    table { 
      border-collapse: collapse; 
      width: 100%; 
      margin-top: 20px; 
      border-radius: 4px;
      overflow: hidden;
    }
    th, td { 
      padding: 15px; 
      text-align: left; 
      border-bottom: 1px solid #e1e8ed;
    }
    th { 
      background-color: #003366; 
      color: white; 
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.9em;
      letter-spacing: 1px;
    }
    tr:nth-child(even) { 
      background-color: #f8fbff; 
    }
    tr:hover {
      background-color: #eef6ff;
    }
    .low { 
      background-color: #fff0f0 !important; 
      color: #d32f2f; 
      font-weight: bold; 
    }
    .status-badge {
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 0.85em;
      font-weight: 500;
    }
    .status-available {
      background-color: #e8f5e9;
      color: #2e7d32;
    }
    .status-low {
      background-color: #ffebee;
      color: #c62828;
    }
    .catalog-section, .usage-section {
      background: #f8fbff;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #b0c4de;
      margin-bottom: 30px;
    }
    .section-header {
      color: #003366;
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 1.4em;
      border-bottom: 2px solid #003366;
      padding-bottom: 8px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header-section">
    <img src="CoopVet.png" alt="CoopVet Logo" class="logo-img">
    <div class="header-text">
      <h2>Medical Stock Management <span id="totalCount" style="font-size: 0.5em; vertical-align: middle; background: #003366; color: white; padding: 5px 10px; border-radius: 20px; margin-left: 10px;">0 Medications</span></h2>
    </div>
  </div>

  <div class="catalog-section">
    <h3 class="section-header">Stock Cataloging</h3>
    <div class="input-row">
      <input type="text" id="medName" placeholder="Medication Name (e.g. Paracetamol)">
      <select id="medUnit" style="padding: 10px; border: 1px solid #b0c4de; border-radius: 4px; flex: 0.5;">
        <option value="pills">Pills/Tablets</option>
        <option value="ml">ml</option>
        <option value="vials">Vials</option>
      </select>
    </div>
    
    <div id="packagingInputs" class="input-row">
      <input type="number" step="0.01" id="numBoxes" placeholder="Total Boxes">
      <input type="number" step="0.01" id="cardsPerBox" placeholder="Cards/Bottles per Box">
      <input type="number" step="0.01" id="unitsPerCard" placeholder="Pills per Card or ml per Bottle">
    </div>

    <div class="input-row">
      <input type="number" step="0.01" id="minRequired" placeholder="Min. Required Boxes (Monthly)">
      <button onclick="addStock()" style="flex: 1;">Add to Catalog</button>
      <a href="records.html" style="text-decoration: none;">
        <button type="button" style="background-color: #00509d; width: 100%;">View Records</button>
      </a>
    </div>
  </div>

  <div class="usage-section">
    <h3 class="section-header">Usage Log</h3>
    <div class="input-row">
      <select id="userName" style="padding: 10px; border: 1px solid #b0c4de; border-radius: 4px; flex: 1; min-width: 150px;">
        <option value="">Select Staff Name</option>
        <option value="Tito Estrongmane">Tito Estrongmane</option>
        <option value="Inacia Telma">Inacia Telma</option>
        <option value="Pedro Antunes">Pedro Antunes</option>
        <option value="Joyce Antunes">Joyce Antunes</option>
        <option value="Carmen do Rosario">Carmen do Rosario</option>
      </select>
      <input type="date" id="dateUsed" style="flex: 0.5;">
    </div>
    
    <div class="input-row">
      <div style="flex: 1; min-width: 200px; display: flex; flex-direction: column; gap: 5px;">
        <input type="text" id="medSearch" placeholder="Search medication..." onkeyup="filterMeds()" style="width: 600px;">
        <select id="usedMed" style="padding: 10px; border: 1px solid #b0c4de; border-radius: 4px; width: 100%;">
          <option value="">Select Medication</option>
        </select>
      </div>
      <input type="number" step="0.01" id="usedAmount" placeholder="Amount Used" style="flex: 0.5;">
    </div>
    
    <div class="input-row">
      <button onclick="logUsage()" style="width: 100%;">Log Usage Entry</button>
    </div>
  </div>
</div>

<script>
// Set default date to today
document.getElementById('dateUsed').valueAsDate = new Date();

let stock = JSON.parse(localStorage.getItem('medical_stock') || '[]');
let usage = JSON.parse(localStorage.getItem('medical_usage') || '[]');

// Initial render
renderStock();
renderUsage();

function addStock() {
  const nameInput = document.getElementById('medName');
  const unitSelect = document.getElementById('medUnit');
  const boxesInput = document.getElementById('numBoxes');
  const packsInput = document.getElementById('cardsPerBox');
  const unitsInput = document.getElementById('unitsPerCard');
  const minInput = document.getElementById('minRequired');
  
  const name = nameInput.value;
  const unit = unitSelect.value;
  const boxes = parseFloat(boxesInput.value) || 0;
  const packsPerBox = parseFloat(packsInput.value) || 1;
  const unitsPerPack = parseFloat(unitsInput.value) || 0;
  const minBoxes = parseFloat(minInput.value) || 0;
  const totalUnits = boxes * packsPerBox * unitsPerPack;

  if (!name || isNaN(totalUnits) || totalUnits <= 0) return alert("Please enter valid medication name and quantity");

  stock.push({ 
    name,
    qty: parseFloat(totalUnits.toFixed(2)),
    unit,
    minBoxes,
    packaging: {
      packsPerBox,
      unitsPerPack
    }
  });
  
  saveData();
  renderStock();
  
  // Clear inputs
  nameInput.value = "";
  boxesInput.value = "";
  cardsInput.value = "";
  unitsInput.value = "";
  minInput.value = "";
}

function saveData() {
  localStorage.setItem('medical_stock', JSON.stringify(stock));
  localStorage.setItem('medical_usage', JSON.stringify(usage));
}

function renderStock() {
  // Sort stock alphabetically by name
  stock.sort((a, b) => a.name.localeCompare(b.name));
  
  // Initial populate of the dropdown
  filterMeds();
  
  document.getElementById('totalCount').innerText = `${stock.length} Medications`;
}

function filterMeds() {
  const search = document.getElementById('medSearch').value.toLowerCase();
  const medSelect = document.getElementById('usedMed');
  
  // Save current selection if any
  const currentSelection = medSelect.value;
  
  medSelect.innerHTML = '<option value="">Select Medication</option>';

  stock.forEach(item => {
    if (item.name.toLowerCase().includes(search)) {
      const useOption = document.createElement('option');
      useOption.value = item.name;
      useOption.textContent = item.name;
      if (item.name === currentSelection) useOption.selected = true;
      medSelect.appendChild(useOption);
    }
  });
}

function logUsage() {
  const userInput = document.getElementById('userName');
  const medSelect = document.getElementById('usedMed');
  const amountInput = document.getElementById('usedAmount');
  const dateInput = document.getElementById('dateUsed');
  
  const user = userInput.value;
  const medName = medSelect.value;
  const amount = parseFloat(amountInput.value);
  const date = dateInput.value;

  if (!user || !medName || isNaN(amount) || !date) return alert("Fill all fields correctly");

  // Find medication in stock and decrement quantity
  const medIndex = stock.findIndex(item => item.name === medName);
  if (medIndex === -1) return alert("Medication not found in stock");
  
  if (stock[medIndex].qty < amount) {
    return alert(`Error: Not enough stock! Current: ${stock[medIndex].qty}${stock[medIndex].unit}`);
  }

  stock[medIndex].qty = parseFloat((stock[medIndex].qty - amount).toFixed(2));
  usage.push({ 
    user, 
    med: medName, 
    amount: amount,
    unit: stock[medIndex].unit,
    date 
  });
  
  saveData();
  renderStock(); // Refresh dropdown and alerts
  
  // Clear inputs
  userInput.value = "";
  medSelect.value = "";
  document.getElementById('medSearch').value = ""; // Clear search
  filterMeds(); // Reset dropdown visibility
  amountInput.value = "";
  document.getElementById('dateUsed').valueAsDate = new Date(); // Reset to today
}

function renderUsage() {
}

function exportExcel() {
  const wb = XLSX.utils.book_new();

  const stockSheet = XLSX.utils.json_to_sheet(stock);
  const usageSheet = XLSX.utils.json_to_sheet(usage);

  XLSX.utils.book_append_sheet(wb, stockSheet, "Stock");
  XLSX.utils.book_append_sheet(wb, usageSheet, "Usage");

  XLSX.writeFile(wb, "medical_stock.xlsx");
}
</script>

</body>
</html>
