<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Medical Stock Manager - CoopVet</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/supabase.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 40px; background-color: #f0f8ff; color: #333; line-height: 1.6; }
    .container { max-width: 1100px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .header-section { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; border-bottom: 3px solid #003366; padding-bottom: 15px; }
    .logo-img { height: 80px; width: auto; }
    .header-text h2 { margin: 0; border-bottom: none; padding-bottom: 0; }
    h2, h3 { color: #003366; border-bottom: 2px solid #003366; padding-bottom: 10px; margin-top: 30px; }
    h2:first-of-type { margin-top: 0; }
    .input-row { display: flex; gap: 10px; margin-bottom: 10px; width: 100%; }
    input, select { padding: 10px; border: 1px solid #b0c4de; border-radius: 4px; flex: 1; min-width: 120px; }
    button { padding: 10px 20px; background-color: #003366; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; transition: background-color 0.2s; }
    button:hover { background-color: #00509d; }
    .catalog-section, .usage-section { background: #f8fbff; padding: 20px; border-radius: 8px; border: 1px solid #b0c4de; margin-bottom: 30px; }
    .section-header { color: #003366; margin-top: 0; margin-bottom: 20px; font-size: 1.4em; border-bottom: 2px solid #003366; padding-bottom: 8px; }
    .input-hint { font-size: 0.75em; color: #888; margin-top: 4px; }
    .loading { text-align: center; padding: 40px; color: #666; font-size: 1.1em; }
    .sync-status { font-size: 0.8em; color: #888; text-align: right; margin-top: 5px; }
    @media print { .no-print { display: none; } }
  </style>
</head>
<body>

<div class="container">
  <div class="header-section">
    <img src="CoopVet.png" alt="CoopVet Logo" class="logo-img">
    <div class="header-text">
      <h2>Medical Stock Management <span id="totalCount" style="font-size: 0.5em; vertical-align: middle; background: #003366; color: white; padding: 5px 10px; border-radius: 20px; margin-left: 10px;">0 Medications</span></h2>
      <div class="sync-status">🔄 Live sync with database</div>
    </div>
  </div>

  <div class="catalog-section no-print">
    <h3 class="section-header">Stock Cataloging</h3>
    <div class="input-row">
      <input type="text" id="medName" placeholder="Medication Name (e.g. Paracetamol)">
      <select id="medUnit" style="flex: 0.4;">
        <option value="pills">Pills/Tablets</option>
        <option value="ml">ml</option>
        <option value="vials">Vials</option>
      </select>
    </div>
    <div class="input-row">
      <input type="number" step="0.01" id="numBoxes" placeholder="Total Boxes">
      <input type="number" step="0.01" id="packsPerBox" placeholder="Cards/Bottles per Box">
      <input type="number" step="0.01" id="unitsPerPack" placeholder="Pills per Card or ml per Bottle">
    </div>
    <div class="input-row">
      <input type="number" step="0.01" id="minRequired" placeholder="Min. Required Boxes (Monthly)">
      <button onclick="addStock(event)" style="flex: 1;">Add to Catalog</button>
      <a href="records.html" style="text-decoration: none;">
        <button type="button" style="background-color: #00509d; width: 100%;">View Records</button>
      </a>
    </div>
    <div class="input-hint">💡 For pills: Boxes → Cards per Box → Pills per Card. For ml: Boxes → Bottles per Box → ml per Bottle.</div>
  </div>

  <div class="usage-section no-print">
    <h3 class="section-header">Usage Log</h3>
    <div class="input-row">
      <select id="userName">
        <option value="">Select Staff Name</option>
        <option value="Tito Estrongomane">Tito Estrongomane</option>
        <option value="Inacia Telma">Inacia Telma</option>
        <option value="Pedro Antunes">Pedro Antunes</option>
        <option value="Joyce Antunes">Joyce Antunes</option>
        <option value="Carmen do Rosario">Carmen do Rosario</option>
      </select>
      <input type="date" id="dateUsed" style="flex: 0.6;">
    </div>
    <div class="input-row">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 5px; min-width: 200px;">
        <input type="text" id="medSearch" placeholder="Search medication..." oninput="filterMeds()">
        <select id="usedMed" size="1" style="padding: 10px; border: 1px solid #b0c4de; border-radius: 4px; width: 100%;">
          <option value="">Select Medication</option>
        </select>
      </div>
      <input type="number" step="0.01" id="usedAmount" placeholder="Amount Used" style="flex: 0.5;">
    </div>
    <div class="input-row">
      <button onclick="logUsage()" style="width: 100%;">Log Usage Entry</button>
    </div>
  </div>

  <div id="loadingScreen" class="loading">🔄 Connecting to database...</div>
</div>

<script>
const SUPABASE_URL = 'https://uoxuuthnxhuaqqplizpl.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVveHV0aG54aHVhYXFxcGxpenBsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDk2MjY0MTYsImV4cCI6MjA2NTE0MjQxNn0.YW5ZL-BRZgA2cGMzMEc5s6e3VZ9q6MLxmpuRLMN7pB8';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let stock = [];
let usage = [];

async function init() {
  document.getElementById('loadingScreen').style.display = 'block';
  try {
    await loadData();
  } catch (err) {
    console.error('Initialization error:', err);
    alert('Failed to connect to database. Please check your console for errors.');
  } finally {
    document.getElementById('loadingScreen').style.display = 'none';
  }
}

async function loadData() {
  const [stockRes, usageRes] = await Promise.all([
    supabase.from('stock').select('*').order('name'),
    supabase.from('usage_log').select('*').order('date', { ascending: false })
  ]);
  stock = stockRes.data || [];
  usage = usageRes.data || [];
  filterMeds();
  document.getElementById('totalCount').innerText = `${stock.length} Medications`;
}

function filterMeds() {
  const search = (document.getElementById('medSearch')?.value || '').toLowerCase();
  const medSelect = document.getElementById('usedMed');
  if (!medSelect) return;
  medSelect.innerHTML = '<option value="">Select Medication</option>';
  stock.filter(s => s.name.toLowerCase().includes(search)).forEach(item => {
    const opt = document.createElement('option');
    opt.value = item.name;
    opt.textContent = `${item.name} (${item.qty} ${item.unit || 'pills'})`;
    medSelect.appendChild(opt);
  });
}

async function addStock(event) {
  console.log('addStock button clicked');
  const btn = event ? event.target : null;
  const originalText = btn ? btn.innerText : 'Add to Catalog';
  const name = document.getElementById('medName').value.trim();
  const unit = document.getElementById('medUnit').value;
  const boxes = parseFloat(document.getElementById('numBoxes').value) || 0;
  const packsPerBox = parseFloat(document.getElementById('packsPerBox').value) || 1;
  const unitsPerPack = parseFloat(document.getElementById('unitsPerPack').value) || 1;
  const minBoxes = parseFloat(document.getElementById('minRequired').value) || 0;
  
  if (!name) return alert('Please enter a medication name');
  if (boxes <= 0) return alert('Please enter a valid number of boxes');
  
  const totalUnits = boxes * packsPerBox * unitsPerPack;

  if (totalUnits <= 0) return alert('Invalid quantity calculation. Please check your inputs.');

  const existing = stock.find(s => s.name.toLowerCase() === name.toLowerCase());
  if (existing) return alert('This medication already exists. Use the Usage Log to deduct stock.');

  const { error } = await supabase.from('stock').insert([{
    name, 
    unit, 
    qty: parseFloat(totalUnits.toFixed(2)), 
    min_boxes: minBoxes,
    packs_per_box: packsPerBox, 
    units_per_pack: unitsPerPack
  }]);

  if (error) {
    console.error('Add stock error:', error);
    return alert('Error adding stock: ' + error.message);
  }

  await loadData();

  // Clear fields
  document.getElementById('medName').value = '';
  document.getElementById('numBoxes').value = '';
  document.getElementById('packsPerBox').value = '';
  document.getElementById('unitsPerPack').value = '';
  document.getElementById('minRequired').value = '';
  alert('Medication added successfully!');
}

async function logUsage() {
  const user = document.getElementById('userName').value;
  const medName = document.getElementById('usedMed').value;
  const amount = parseFloat(document.getElementById('usedAmount').value);
  const date = document.getElementById('dateUsed').value;

  if (!user || !medName || !amount || !date) return alert('Fill all fields correctly');

  const med = stock.find(s => s.name === medName);
  if (!med) return alert('Medication not found');
  if (med.qty < amount) return alert(`Not enough stock! Current: ${med.qty} ${med.unit}`);

  const newQty = parseFloat((med.qty - amount).toFixed(2));

  // Update stock first
  const { error: stockError } = await supabase.from('stock').update({ qty: newQty }).eq('id', med.id);
  if (stockError) return alert('Error updating stock: ' + stockError.message);

  // Then log usage
  const { error: usageError } = await supabase.from('usage_log').insert([{ 
    staff_name: user, 
    med: medName, 
    amount, 
    unit: med.unit, 
    date 
  }]);
  
  if (usageError) return alert('Error logging usage: ' + usageError.message);

  await loadData();

  document.getElementById('userName').value = '';
  document.getElementById('usedMed').value = '';
  document.getElementById('usedAmount').value = '';
  document.getElementById('medSearch').value = '';
  document.getElementById('dateUsed').valueAsDate = new Date();
  alert('Usage logged successfully!');
}

document.getElementById('dateUsed').valueAsDate = new Date();

supabase.channel('db_changes')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'stock' }, () => loadData())
  .on('postgres_changes', { event: '*', schema: 'public', table: 'usage_log' }, () => loadData())
  .subscribe();

init();
</script>
</body>
</html>
